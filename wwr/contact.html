<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Rush Rafting</title>
    <meta name="description" content="Contact Rapid Rush Rafting with questions about our company and services.">
    <meta name="author" content="Festus Odiley">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us | Rapid Rush Rafting</h1>

        <section class="contact-info">
            <h2>Contact Information</h2>

            <p><strong>Address:</strong> Whitehorse, Yukon, Canada</p>
            <p><strong>Phone:</strong> (208) 555-1234</p>
            <p><strong>Email:</strong> info@rapidrushrafting.com</p>

            <iframe
                src="https://www.google.com/maps?q=Whitehorse%2C%20Yukon%2C%20Canada&amp;output=embed"
                title="Map to Rapid Rush Rafting"
                width="600"
                height="300"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Portrait of the general manager">
                <figcaption>John Smith - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Portrait of the lead river guide">
                <figcaption>Sarah Johnson - Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Portrait of the reservations manager">
                <figcaption>David Wilson - Reservations Manager</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Ask Us a Question</h2>
            <form action="#" method="post">
                <label for="visitor-name">Your Name:</label>
                <input type="text" id="visitor-name" name="visitor-name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <input type="radio" id="general" name="purpose" value="general" checked>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Festus Odiley</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://www.instagram.com/">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>
</html>
